name: Pull Request Validation

on:
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"

permissions: {}

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
            - name: Install cargo nextest
              uses: taiki-e/install-action@cargo-nextest
            - uses: Swatinem/rust-cache@v2
            - name: Compile
              run: cargo check --locked --no-default-features --features bundled-tesseract
            - name: Run tests
              run: cargo nextest run --all-targets --no-default-features --features bundled-tesseract

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy,rustfmt
            - uses: Swatinem/rust-cache@v2
            - name: Run cargo fmt
              run: cargo fmt --all --check
            - name: Run cargo clippy
              run: cargo clippy --all-targets --no-default-features --features bundled-tesseract -- -D warnings

    system-tesseract-image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - name: Install just
              uses: taiki-e/install-action@just
            - name: Build and smoke-test the system Tesseract image
              run: just docker-smoke-system-tesseract
