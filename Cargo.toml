[package]
name = "ocr_service"
version = "0.4.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["bundled-tesseract"]
bundled-tesseract = ["tesseract-rs/build-tesseract"]
system-tesseract = ["tesseract-rs/use-system-tesseract"]

[[bin]]
path = "src/main.rs"
name = "ocr_service"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart"] }
tower = { version = "0.5.3", features = [] }
tower-http = { version = "0.7.1", features = [
    "trace",
    "timeout",
    "cors",
    "normalize-path",
    "limit",
] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
reqwest = { version = "0.13.5" }
tonic = { version = "0.14.6", features = ["tls-native-roots"] }
futures-util = "0.3.34"
pin-project-lite = "0.2.17"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
dotenvy = "0.15.7"
anyhow = "1.0.104"
thiserror = "2.0.21"
tesseract-rs = { version = "0.4.0", default-features = false }
image = "0.25.10"
walkdir = "2.5.0"
toml = "1.1.8"

# OpenTelemetry
opentelemetry = { version = "0.33.1", features = ["logs", "metrics", "trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "logs", "metrics", "trace", "spec_unstable_metrics_views"] }
opentelemetry-semantic-conventions = { version = "0.33.1", features = ["semconv_experimental"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic","tls-roots"] }
opentelemetry-appender-tracing = { version = "0.33.1", features = [] }
opentelemetry-instrumentation-tower = {version = "0.19.0", features = ["axum"] }

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-opentelemetry = { version = "0.34.0", features = ["metrics"] }

# OpenAPI Documentation
utoipa-axum = "0.3.0"
utoipa = "6.0.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["yaml", "filters"] }
tempfile = "3.27.0"

[profile.dev.package]
# Insta: Faster runs https://insta.rs/docs/quickstart/#optional-faster-runs
insta.opt-level = 3

[profile.release]
opt-level = "z"   # Optimize for size.
strip = true      # Automatically strip symbols from the binary.
lto = true        # Enable Link Time Optimization (LTO)
codegen-units = 1 # Reduce Parallel Code Generation Units to Increase Optimization
panic = "abort"

[workspace.lints.clippy]
# Prevent panics from unwraps and unsafe slicing or indexing
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"
expect_used = "warn"
arithmetic_side_effects = "warn"

# Prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

# Prevent unsafe things with memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Prevent potentially incorrect things with numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
# these effectively force you to document numeric invariants
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
